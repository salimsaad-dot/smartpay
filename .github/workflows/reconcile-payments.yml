name: Reconcile Online Payments

on:
  schedule:
    # Every 30 minutes. Asks Paystack about any online payment SmartPay
    # hasn't settled after 10 minutes (lost webhook, parent closed the tab)
    # and credits the ones that went through. See
    # smartpay-backend/utils/paymentReconciler.js. A failed run (any check
    # erroring) makes curl fail, so GitHub emails the repo owner.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile online payments
        env:
          # Secrets pasted into GitHub often carry a stray space or line
          # break, which made curl fail with "URL malformed" (exit 3) on
          # every run until 2026-10-16. Strip whitespace and fail clearly.
          BACKEND_URL: ${{ secrets.SMARTPAY_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$(printf '%s' "$BACKEND_URL" | tr -d '[:space:]')"
          url="${url%/}"
          secret="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          if [ -z "$url" ] || [ -z "$secret" ]; then
            echo "::error::SMARTPAY_BACKEND_URL or CRON_SECRET is missing in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl -sSf --max-time 120 --retry 2 --retry-delay 20 \
            -X POST "$url/api/cron/reconcile-payments" \
            -H "x-cron-secret: $secret"
