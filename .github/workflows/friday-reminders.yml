name: Friday Fee Reminders

on:
  schedule:
    # Hourly, Fridays only, 06:00-20:00 UTC (= Accra time, Ghana has no
    # DST). Each school has its own configurable friday_send_time; the
    # job itself (POST /api/cron/friday-reminders) skips any school not
    # yet due this hour and is picked up by a later firing the same day —
    # see smartpay-backend/utils/fridayJob.js's respectSendTime logic.
    - cron: '0 6-20 * * 5'
  workflow_dispatch: {}

# One run at a time: an hourly run waits for the previous one to finish.
concurrency:
  group: friday-reminders
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Friday reminder job
        env:
          # Secrets pasted into GitHub often carry a stray space or line
          # break, which made curl fail with "URL malformed" (exit 3) on
          # every run until 2026-10-16. Strip whitespace and fail clearly.
          BACKEND_URL: ${{ secrets.SMARTPAY_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$(printf '%s' "$BACKEND_URL" | tr -d '[:space:]')"
          url="${url%/}"
          secret="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          if [ -z "$url" ] || [ -z "$secret" ]; then
            echo "::error::SMARTPAY_BACKEND_URL or CRON_SECRET is missing in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Each call is one ~45-second slice (utils/fridayJob.js); "more": true
          # means a school paused or wasn't reached yet, so call again. Capped
          # so a stuck run can't loop forever; the next hourly run resumes.
          failed=0
          for i in $(seq 1 40); do
            code=$(curl -sS --max-time 120 --retry 2 --retry-delay 10 -o response.json -w '%{http_code}'               -X POST "$url/api/cron/friday-reminders"               -H "x-cron-secret: $secret") || { echo "::error::Request failed"; exit 1; }
            echo "Call $i: HTTP $code"
            if [ "$code" = "502" ]; then
              failed=1
            elif [ "$code" != "200" ]; then
              cat response.json; echo "::error::Unexpected HTTP $code"; exit 1
            fi
            [ "$(jq -r '.more' response.json)" = "true" ] || break
          done
          if [ "$failed" = "1" ]; then
            echo "::error::Some schools' reminders failed (the owner was emailed details)."
            exit 1
          fi
