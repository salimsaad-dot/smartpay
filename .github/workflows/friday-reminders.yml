name: Friday Fee Reminders

on:
  schedule:
    # Hourly, Fridays only, 06:00-20:00 UTC (= Accra time, Ghana has no
    # DST). Each school has its own configurable friday_send_time; the
    # job itself (POST /api/cron/friday-reminders) skips any school not
    # yet due this hour and is picked up by a later firing the same day —
    # see smartpay-backend/utils/fridayJob.js's respectSendTime logic.
    - cron: '0 6-20 * * 5'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Friday reminder job
        env:
          # Secrets pasted into GitHub often carry a stray space or line
          # break, which made curl fail with "URL malformed" (exit 3) on
          # every run until 2026-10-16. Strip whitespace and fail clearly.
          BACKEND_URL: ${{ secrets.SMARTPAY_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$(printf '%s' "$BACKEND_URL" | tr -d '[:space:]')"
          url="${url%/}"
          secret="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          if [ -z "$url" ] || [ -z "$secret" ]; then
            echo "::error::SMARTPAY_BACKEND_URL or CRON_SECRET is missing in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl -sSf --max-time 60 --retry 3 --retry-delay 10 \
            -X POST "$url/api/cron/friday-reminders" \
            -H "x-cron-secret: $secret"
